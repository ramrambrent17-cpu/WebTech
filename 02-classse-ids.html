<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes and IDs</title>
</head>
<body>

    <header class="site-header">
        <h1>My Website</h1>
    </header>

    <nav id="main-nav">
        <p>My Navigation</p>
    </nav>

    <main class="content">
        <section id="about">
            <h2>About Me</h2>
            <p class="introduction">
                Hello I am a student learning web development.
            </p>

            <div id="container" class="card featured">
                
                <p>This is my credit card.</p>
            </div>
        </section>
    </main>
    
    <footer class="site-footer">
        <p>Date 2026 My Website</p>
    </footer>
</body>
</html>
